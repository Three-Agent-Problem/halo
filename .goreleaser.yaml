# Releases: push a tag (git tag v0.1.0 && git push origin v0.1.0) and the release workflow
# runs this. It publishes the GitHub release and the Homebrew cask. Try it locally:
#   goreleaser release --snapshot --clean
version: 2
project_name: halo

builds:
  - id: halo
    main: ./cmd/halo
    binary: halo
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    # Unix only: Halo manages the agents' process groups.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^gofmt$"]

homebrew_casks:
  - name: halo
    repository:
      owner: Three-Agent-Problem
      name: homebrew-tap
      # The workflow's own GITHUB_TOKEN can't push to another repo.
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    directory: Casks
    homepage: https://github.com/three-agent-problem/halo
    description: A team of Claude Code agents that work together over A2A, live in your terminal
    license: Apache-2.0
    caveats: |
      Try it without a server: halo --demo
      For real runs Halo needs a Lagrange server and Claude Code's ACP adapter:
        npm i -g @agentclientprotocol/claude-agent-acp
      Step by step: https://github.com/three-agent-problem/halo/blob/main/docs/guide.md
    # The binary isn't signed by Apple; without this, macOS says it's damaged.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/halo"]
          end

release:
  prerelease: auto
